<!-- Negative margin: 24px from the stat cards instead of the usual section gap -->
<section class="-mt-4 grid gap-5 lg:-mt-6">
  <h2 class="text-preset-2">Letter Density</h2>

  @if (rows().length) {
    <!-- Rows share one grid (subgrid) so every bar starts and ends at the same place -->
    <ul class="grid grid-cols-[1rem_1fr_auto] gap-x-3.5 gap-y-3">
      @for (row of visibleRows(); track row.letter) {
        <li class="col-span-full grid grid-cols-subgrid items-center">
          <span>{{ row.letter }}</span>
          <span class="h-3 rounded-full bg-neutral-100 dark:bg-neutral-800">
            <span class="block h-full rounded-full bg-purple-400" [style.width.%]="row.percent"></span>
          </span>
          <span class="justify-self-end">{{ row.count }} ({{ row.percent | number: '1.2-2' }}%)</span>
        </li>
      }
    </ul>
  } @else {
    <p>No characters found. Start typing to see letter density.</p>
  }

  @if (hasMore()) {
    <button
      type="button"
      class="flex cursor-pointer items-center gap-2 justify-self-start rounded-sm text-preset-3 hover:underline hover:underline-offset-4"
      [attr.aria-expanded]="expanded()"
      (click)="expanded.set(!expanded())"
    >
      {{ expanded() ? 'See less' : 'See more' }}
      <svg class="size-4 transition-transform" [class.rotate-180]="expanded()" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m4 6 4 4 4-4" />
      </svg>
    </button>
  }
</section>
